<h2>インストールが終わりました</h2>
<p>アプリは「アプリケーション」フォルダの <b>AJT JOY16</b> から開けます。右上の「電源 ON」を押して、キーボードの Z・X・C を押すと音が出ます。</p>
<p>DAW をお使いなら、DAW を起動し直すとプラグインが出てきます。</p>
<p>はじめてアプリを開くときに確認が出たら、「開く」を押してください。</p>
