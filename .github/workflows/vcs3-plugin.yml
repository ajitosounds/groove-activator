# Builds the VCS3 Pin Matrix plugin (Advanced edition) for macOS and Windows.
# The zipped plugins are attached to each run as downloadable artifacts.
name: VCS3 plugin

on:
  push:
    paths:
      - 'vcs3-plugin/**'
      - 'vcs3-advanced/**'
      - '.github/workflows/vcs3-plugin.yml'
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S vcs3-plugin -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign (ad-hoc), check the AU, package
        run: |
          A="build/VCS3PinMatrix_artefacts/Release"
          for f in "$A/VST3/VCS3 Pin Matrix.vst3" "$A/AU/VCS3 Pin Matrix.component" "$A/Standalone/VCS3 Pin Matrix.app"; do
            codesign --force --deep --sign - "$f"
          done
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/VCS3 Pin Matrix.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu V3pm Gacl
          mkdir out
          cp -R "$A/VST3/VCS3 Pin Matrix.vst3" "$A/AU/VCS3 Pin Matrix.component" "$A/Standalone/VCS3 Pin Matrix.app" out/
          cp vcs3-plugin/INSTALL.txt out/
          (cd out && zip -qry ../VCS3-Pin-Matrix-Plugin-macOS.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: VCS3-Pin-Matrix-Plugin-macOS
          path: VCS3-Pin-Matrix-Plugin-macOS.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebView2 SDK (for the panel)
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force
      - name: Configure
        run: cmake -S vcs3-plugin -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Package
        shell: pwsh
        run: |
          $A = "build/VCS3PinMatrix_artefacts/Release"
          New-Item -ItemType Directory out | Out-Null
          Copy-Item -Recurse "$A/VST3/VCS3 Pin Matrix.vst3" out/
          Copy-Item "$A/Standalone/VCS3 Pin Matrix.exe" out/
          Copy-Item vcs3-plugin/INSTALL.txt out/
          Compress-Archive -Path out/* -DestinationPath VCS3-Pin-Matrix-Plugin-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VCS3-Pin-Matrix-Plugin-Windows
          path: VCS3-Pin-Matrix-Plugin-Windows.zip
          if-no-files-found: error
